<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Image renderer</title>
<!-- Used by tools/render-images.js to draw email and link-preview images from a theme. -->
<style>
  html, body { margin: 0; }
  body.stamp, body.stamp .stage { width: 440px; height: 240px; background: transparent; }
  body.og2, body.og2 .stage { width: 1200px; height: 630px; }
  body.stamp svg, body.og2 svg { display: block; color: var(--gold); }
  body.og { width: 1200px; height: 630px; display: flex; align-items: center; justify-content: center; }
  body.og .stage { width: 760px; }
  body.og .envelope { box-shadow: 0 24px 60px rgba(0, 0, 0, .45); }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script src="../backend/core.js"></script>
<script src="../themes/registry.js"></script>
<script>
  var q = new URLSearchParams(location.search);
  var ev = { theme: q.get('theme') || 'diwali', template: q.get('template') || '', colors: { ground: q.get('ground'), accent: q.get('accent') } };
  Themes.load(ev.theme).then(function (theme) {
    document.body.className = q.get('mode') + ' ' + Themes.classes(ev);
    document.body.setAttribute('style', Themes.vars(ev));
    var mode = q.get('mode');
    document.getElementById('stage').innerHTML = mode === 'stamp' ? theme.stampArt(ev) :
      mode === 'og2' ? theme.previewArt(ev) : theme.envelope(ev, 'you');
    return document.fonts.ready;
  }).then(function () { document.body.setAttribute('data-ready', '1'); });
</script>
</body>
</html>
